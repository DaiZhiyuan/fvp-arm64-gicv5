---
# Configuration name (informational only).
  name: gicv5_config
# GICv5 configuration schema version expected by the FVP (must be 1).
  version: 1

  # Top-level GICv5 system properties.
  GIC_TOP:
    # Physical address range: 0b0110 = 52 bits (4 PB); must match the platform PA size.
    - pa_range: 6 # 0b0110   52 bits, 4PB (should match the 'System' PA size)
      # Implement CoreSight debug/trace support in the GICv5.
      has_coresight: false
      # Allow asynchronous (posted) operations in the GICv5 model.
      support_async: false
      # JEP106 implementer ID reported in GICv5 ID registers (0x43b = Arm).
      implementer: 0x43b

      # Interrupt Wire Bridge instances (wired interrupt inputs forwarded to an ITS).
      IWB:
        # Unique name of this IWB instance.
        - name: "iwb0"
          # IWB configuration register frame base address (64 KB aligned).
          config_frame_base_address: 0x2F000000
          # Unique IWB identifier (0-based).
          iwb_id: 0
          # ITS instance that receives interrupts generated by this IWB.
          target_itsid: 0
          # Number of interrupt wires implemented by this IWB (16-bit value).
          num_wires: 64        # 16 bit value
          # DeviceID used by this IWB when sending events to its ITS (16-bit value).
          device_id: 64        # 16 bit value
          # Bitmask of security domains served by this IWB (7 = all domains).
          domains: 7

      # Interrupt Translation Service instances (MSI/IWB events translated to LPIs).
      ITS:
        # Unique name of this ITS instance.
        - name: "its0"
          # Unique ITS identifier (0-based).
          itsid: 0
          # IRS instance that receives the translated interrupts.
          target_irsid: 0
          # Width of DeviceID in bits; the maximum permitted value is 32.
          device_id_bits: 20                          # The maximum permitted value of this field is 32 (dec).
          # Width of EventID in bits; the maximum permitted value is 32.
          event_id_bits: 0x10                         # The maximum permitted value of this field is 32 (dec).
          # Device table layout: 0 = linear only, 1 = linear and 2-level.
          device_table_levels: 0x01                   # 0b00 - linear DT only. 0b01 linear and 2-level DT supported.
          # Interrupt translation table layout: 0 = linear only, 1 = linear and 2-level.
          interrupt_translation_table_levels: 0x01    # 0b00 - linear ITT only. 0b01 linear and 2-level ITT supported.
          # Enable software error (SWERR) reporting from this ITS.
          has_swerr_reporting: false
          # Level-2 table split value for 2-level tables (3-bit field; 7 = model default).
          level2_splits: 7
          # Expose MPAM (memory system resource partitioning) support.
          has_mpam: false
          # Expose Memory Encryption Context (MEC) support.
          has_mec: false
          # Per-security-domain ITS register frames.
          domains:
              # Non-secure domain configuration.
              - type: Non_Secure
                # ITS configuration frame base address (64 KB aligned).
                config_frame_base_address: 0x2F120000
                # ITS translation frame base address(es) (64 KB aligned).
                translate_frame_base_addresses: [0x2F130000]
              # Secure domain configuration.
              - type: Secure
                # ITS configuration frame base address (64 KB aligned).
                config_frame_base_address: 0x2F100000
                # ITS translation frame base address(es) (64 KB aligned).
                translate_frame_base_addresses: [0x2F110000]
              # EL3 (root) domain configuration.
              - type: EL3
                # ITS configuration frame base address (64 KB aligned).
                config_frame_base_address: 0x2F140000
                # ITS translation frame base address(es) (64 KB aligned).
                translate_frame_base_addresses: [0x2F150000]

      # Interrupt Routing Service (interrupt state and routing).
      IRS:
        # Settings shared by every IRS instance.
        COMMON:
          # Total SPI INTID range supported by all IRS instances.
          spi_range: 256                        # SPI range supported across all the IRSs.
          # Implement the optional SETLPI register frame.
          support_setlpi_frame: true            # Implement set LPI register frame.
          # Enable one-of-N SPI targeting.
          support_one_of_n: false
          # Number of PE affinity bits supported by the IRS (1-16).
          affinity_bits_supported: 16
          # Enable LPI support in the IRS.
          support_lpi: true
          # Minimum number of LPI ID bits (maximum 14).
          min_lpi_id_bits: 0                    # The minimum number of LPI ID Bits supported. (The maximum value supported for this field is 14.)
          # Maximum number of LPI ID bits (maximum 24).
          max_lpi_id_bits: 24                   # The maximum number of LPI ID Bits supported. (The maximum value supported for this field is 24.)
          # Number of IST levels: 1 = flat, 2 = two-level.
          ist_levels: 2                         # Levels supported for the IST, possible values [1 - 2], '1' is the default, '2' means 2-level structure is supported.
          # Store metadata in level-2 ISTEs (only meaningful when ist_levels = 2).
          istmd: false                          # Reports whether the IRS stores metadata in the level 2 ISTEs, default is 'false' which means that IST entries don't require storage for metadata.
          # Level-2 IST split value (1-7; larger values allow smaller level-2 tables).
          ist_splits: 7                         # Supported split values when a 2-level IST structure is used. possible values are from 1 to 7, '1' is default means Level 2 IST sizes supported:4KB
          # Minimum LPI ID bits requiring 16-byte level-2 ISTEs for metadata.
          istmd_sz: 0                           # Minimum number of LPI ID bits which requires a level 2 ISTE size of 16 bytes to store metadata.
          # Number of VM ID bits reported in IRS_IDR4 (8-16).
          vm_id_bits: 16                        # The number of VM ID bits supported by the IRS.
          # Number of VPE ID bits reported in IRS_IDR4 (8-16).
          vpe_id_bits: 16                       # The number of VPE ID bits supported by the IRS.
          # VPE descriptor size as log2(bytes) reported in IRS_IDR4 (3-12).
          vped_size: 3                          # VPE descriptors are 2^vped_size bytes (8 bytes here).
          # VMT levels: 1 = flat, 2 = two-level.
          vmt_levels: 2                         # Levels supported for the VMT, possible values [1 - 2].
          # Advertise virtual one-of-N support; requires support_one_of_n.
          support_virtual_one_of_n: false       # Only valid when support_one_of_n is enabled.
        # Configured IRS instances.
        INSTANCES:
          # Unique name of this IRS instance.
          - name: "irs0"
            # Unique IRS identifier (0-based).
            irsid: 0
            # SPI INTID range handled by this IRS instance.
            spi_irs_range: 256                  # SPI range supported for this IRS instance.
            # First (lowest) SPI INTID implemented by this IRS instance.
            spi_base: 0                         # The minimum SPI ID implemented for this IRS instance.
            # Per-security-domain IRS register frames.
            domains:
              # Non-secure domain configuration.
              - config_frame_base_address: 0x2F1A0000
                # IRS LPI register frame base address.
                lpi_frame_base_address: 0x2F1B0000
                # Security domain name.
                type: Non_Secure
                # Implemented interrupt priority bits for this domain (2-5).
                priority_bits: 5
                # SPIs statically assigned to this domain (empty list = none).
                static_spis: []
              # Secure domain configuration.
              - config_frame_base_address: 0x2F180000
                # IRS LPI register frame base address.
                lpi_frame_base_address: 0x2F190000
                # Security domain name.
                type: Secure
                # Implemented interrupt priority bits for this domain (2-5).
                priority_bits: 5
                # SPIs statically assigned to this domain (empty list = none).
                static_spis: []
              # EL3 (root) domain configuration.
              - config_frame_base_address: 0x2F1C0000
                # IRS LPI register frame base address.
                lpi_frame_base_address: 0x2F1D0000
                # Security domain name.
                type: EL3
                # Implemented interrupt priority bits for this domain (2-5).
                priority_bits: 5
                # SPIs statically assigned to this domain (empty list = none).
                static_spis: []
            # PE affinities served by this IRS; must match the platform core wiring.
            processing_element_affinities: [0, 1, 2, 3, 4, 5, 6, 7]
            # Expose MPAM support on this IRS instance.
            has_mpam: false
            # Expose Memory Encryption Context (MEC) support on this IRS instance.
            has_mec: false

  # Per-core GICv5 CPU interface configuration (one entry per PE).
  CPU_INTERFACE:
    # First CPU core (core index 0).
    - core_id: 0  # Core ID of the Core implementing the CPUIF (starting from 0)
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0    # Number of non-architected PPIs to be implemented starting from the PPI ID 64.
      # Signal preemptive interrupts with superpriority (NMI-like) priority.
      signal_preemptive_interrupt_with_superpriority: false
      # Bitmask of implemented non-architected PPIs (0 = none).
      implemented_non_arch_ppis_mask: 0
      # Bitmask of non-architected PPIs with configurable handling mode (0 = none).
      handling_mode_non_arch_ppis_mask: 0
    # Second CPU core (core index 1).
    - core_id: 1
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0
      # Signal preemptive interrupts with superpriority (NMI-like) priority.
      signal_preemptive_interrupt_with_superpriority: false
      # Bitmask of implemented non-architected PPIs (0 = none).
      implemented_non_arch_ppis_mask: 0
      # Bitmask of non-architected PPIs with configurable handling mode (0 = none).
      handling_mode_non_arch_ppis_mask: 0
    # Third CPU core (core index 2).
    - core_id: 2
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0
      # Signal preemptive interrupts with superpriority (NMI-like) priority.
      signal_preemptive_interrupt_with_superpriority: false
      # Bitmask of implemented non-architected PPIs (0 = none).
      implemented_non_arch_ppis_mask: 0
      # Bitmask of non-architected PPIs with configurable handling mode (0 = none).
      handling_mode_non_arch_ppis_mask: 0
    # Fourth CPU core (core index 3).
    - core_id: 3
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0
      # Signal preemptive interrupts with superpriority (NMI-like) priority.
      signal_preemptive_interrupt_with_superpriority: false
      # Bitmask of implemented non-architected PPIs (0 = none).
      implemented_non_arch_ppis_mask: 0
      # Bitmask of non-architected PPIs with configurable handling mode (0 = none).
      handling_mode_non_arch_ppis_mask: 0
    # Fifth CPU core (core index 4).
    - core_id: 4
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0
      # Signal preemptive interrupts with superpriority (NMI-like) priority.
      signal_preemptive_interrupt_with_superpriority: false
      # Bitmask of implemented non-architected PPIs (0 = none).
      implemented_non_arch_ppis_mask: 0
      # Bitmask of non-architected PPIs with configurable handling mode (0 = none).
      handling_mode_non_arch_ppis_mask: 0
    # Sixth CPU core (core index 5).
    - core_id: 5
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0
      # Signal preemptive interrupts with superpriority (NMI-like) priority.
      signal_preemptive_interrupt_with_superpriority: false
      # Bitmask of implemented non-architected PPIs (0 = none).
      implemented_non_arch_ppis_mask: 0
      # Bitmask of non-architected PPIs with configurable handling mode (0 = none).
      handling_mode_non_arch_ppis_mask: 0
    # Seventh CPU core (core index 6).
    - core_id: 6
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0
      # Signal preemptive interrupts with superpriority (NMI-like) priority.
      signal_preemptive_interrupt_with_superpriority: false
      # Bitmask of implemented non-architected PPIs (0 = none).
      implemented_non_arch_ppis_mask: 0
      # Bitmask of non-architected PPIs with configurable handling mode (0 = none).
      handling_mode_non_arch_ppis_mask: 0
    # Eighth CPU core (core index 7).
    - core_id: 7
      # Enable FEAT_GCIE_LEGACY (legacy GIC CPU interface) on this core.
      has_gicv5_legacy: true
      # Supported INTID width on this CPU interface (16 or 24).
      supported_int_id_bits: 16
      # Number of non-architected PPIs implemented starting at PPI 64.
      number_of_non_arch_ppis_implemented: 0
